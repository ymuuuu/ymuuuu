name: latest blog posts

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://ymuu.me/rss.xml"
          max_post_count: 3
          template: "- 📝 [$title]($url)$newline"
          tag_post_pre_newline: true
