name: terminal card

# Rebuilds terminal-card.svg (top repos by stars) from the GitHub API, so the
# card on the profile never goes stale.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/card/**"
      - ".github/workflows/card.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/card/build_card.py .github/card/card.json terminal-card.svg
          python3 .github/card/build_stats.py .github/card/card.json stats.svg langs.svg

      - name: Commit if changed
        run: |
          git add -N stats.svg langs.svg
          if git diff --quiet -- terminal-card.svg stats.svg langs.svg; then
            echo "card unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add terminal-card.svg stats.svg langs.svg
          git commit -m "card: refresh profile cards"
          git push
